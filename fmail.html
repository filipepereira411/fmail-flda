<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fmail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<style>
:root{--bg:#e9eef2;--card:#fff;--ink:#14263a;--mute:#5d6f80;--line:#cbd5de;--acc:#f2b705;--acc-ink:#14263a;--err:#b3261e;--ok:#1b7a4b;--note:#fff6d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b27;--card:#172a3b;--ink:#e8eef4;--mute:#9bb0c2;--line:#2b4155;--err:#ff8a80;--ok:#6fd7a1;--note:#3a3315;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:40px 20px}
main.wide{max-width:860px}
h1{font-size:2.2rem;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:0 0 12px}
p.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.note{background:var(--note);border-left:5px solid var(--acc);border-radius:6px;padding:12px 14px;margin:0 0 20px;font-size:.95rem}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--acc);color:var(--acc-ink)}
button:disabled{opacity:.6;cursor:wait}
button.full{width:100%;margin-top:20px;padding:12px}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.msg{min-height:1.4em;margin-top:12px;font-size:.92rem}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.switch{margin-top:18px;text-align:center;color:var(--mute);font-size:.92rem}
.switch a{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.sent{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--mute);padding:16px 0}
.code{letter-spacing:.5em;font-size:1.4rem;text-align:center;font-weight:600}
.demo{background:var(--note);border:1.5px dashed var(--acc);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:.9rem}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ============ CONFIGURAÇÃO ============ */
var CONFIG={
  DOMINIO:"@fmail.com",            // clientes só podem registar-se com este domínio
  REMETENTE:"admin@fmail.com",     // endereço de onde saem os emails
  ADMIN_USER:"admin",
  ADMIN_PASS:"admin",
  ADMIN_EMAIL:"admin@fmail.com",                  // se preencher, o admin também usa 2FA (código enviado para este email)
  URL_DO_SITE:"https://fmail.com",
  /* Envio automático com EmailJS (emailjs.com). Vazio = MODO DE TESTE (o código aparece no ecrã). */
  EMAILJS_PUBLIC_KEY:"XEhKqkzMY2YNOjMV0",
  EMAILJS_SERVICE_ID:"service_mo0p8cd",
  EMAILJS_TEMPLATE_ID:"template_x8phngk"
};
/* ====================================== */

var mem={};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]!==undefined?mem[k]:d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function setMsg(t,c){var m=$("msg");if(m){m.textContent=t;m.className="msg "+(c||"")}}

var clients=load("clientes",[]);
var session=load("sessao",null);
var pending=null;   // pedido de código em curso (só em memória)
var autoMail=!!(CONFIG.EMAILJS_PUBLIC_KEY&&CONFIG.EMAILJS_SERVICE_ID&&CONFIG.EMAILJS_TEMPLATE_ID&&window.emailjs);
if(autoMail){try{emailjs.init({publicKey:CONFIG.EMAILJS_PUBLIC_KEY})}catch(e){autoMail=false}}
function siteUrl(){return CONFIG.URL_DO_SITE||location.href.split("#")[0]}

/* ---------- Email: validação de formato ---------- */
function emailError(v){
  v=v.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+$/.test(v))return "Escreva um email completo, como nome"+CONFIG.DOMINIO+".";
  var parts=v.split("@"),local=parts[0];
  if(v.slice(-CONFIG.DOMINIO.length)!==CONFIG.DOMINIO)return "Só são aceites emails "+CONFIG.DOMINIO+".";
  if(!/^[a-z0-9._%+-]{1,64}$/.test(local)||/^\.|\.$|\.\./.test(local))return "A parte antes do @ só pode ter letras, números e . _ % + - (sem pontos seguidos ou no início/fim).";
  return "";
}

/* ---------- Palavras-passe (PBKDF2 + sal) ---------- */
function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return("0"+b.toString(16)).slice(-2)}).join("")}
async function derive(p,salt){
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:100000,hash:"SHA-256"},k,256);
  return toHex(bits);
}
async function hashPass(p){
  if(!(window.crypto&&crypto.subtle))return "plain:"+p;
  var salt=toHex(crypto.getRandomValues(new Uint8Array(16)));
  return "pb:"+salt+":"+await derive(p,salt);
}
async function checkPass(c,p){
  if(c.pass!==undefined)return c.pass===p;                 // contas antigas
  if(c.hash.indexOf("plain:")===0)return c.hash==="plain:"+p;
  var s=c.hash.split(":");
  if(!(window.crypto&&crypto.subtle))return false;
  return (await derive(p,s[1]))===s[2];
}

/* ---------- Códigos por email (2FA, verificação, recuperação) ---------- */
function newCode(){return String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000)}
function sendMail(to,name,subject,text){
  if(!autoMail)return Promise.resolve("test");
  return emailjs.send(CONFIG.EMAILJS_SERVICE_ID,CONFIG.EMAILJS_TEMPLATE_ID,{to_email:to,to_name:name,from_email:CONFIG.REMETENTE,subject:subject,message:text}).then(function(){return "sent"});
}
var TEXTOS={
  login:["Código de entrada","o seu código de entrada"],
  register:["Confirme o seu email","o código para confirmar o seu email"],
  reset:["Recuperar palavra-passe","o código para criar uma nova palavra-passe"]
};
async function issueCode(purpose,email,name,data,realUser){
  var code=newCode();
  pending={purpose:purpose,email:email,name:name,data:data||{},code:code,exp:Date.now()+300000,tries:0,test:!autoMail,fake:!realUser};
  if(realUser){
    var t=TEXTOS[purpose];
    await sendMail(email,name,t[0],"Olá "+name+",\n\nEste é "+t[1]+": "+code+"\nÉ válido durante 5 minutos. Se não pediu isto, ignore este email.\n\nFmail");
  }
}
function checkCode(v){
  if(!pending)return "expired";
  if(Date.now()>pending.exp)return "expired";
  if(pending.tries>=5)return "locked";
  if(v.trim()===pending.code&&!pending.fake)return "ok";
  pending.tries++;
  return pending.tries>=5?"locked":"bad";
}
var CODE_ERR={bad:"Código incorreto. Verifique o email e tente novamente.",expired:"O código expirou. Peça um novo.",locked:"Demasiadas tentativas. Peça um novo código."};
function demoBox(){return(pending&&pending.test&&!pending.fake)?'<div class="demo"><strong>Modo de teste:</strong> sem EmailJS configurado não é enviado nenhum email. O código é <strong>'+pending.code+'</strong>.</div>':''}

/* ---------- Ecrãs ---------- */
function render(view){
  $("app").className="";
  if(session&&session.role==="admin")return renderAdmin();
  if(session&&session.role==="client")return renderClient();
  if(view==="registo")return renderRegister();
  if(view==="recuperar")return renderForgot();
  renderLogin();
}

function renderLogin(msg){
  pending=null;
  $("app").innerHTML=
  '<h1>Fmail</h1><p class="sub">Entre na sua conta para continuar.</p>'+
  '<div class="card"><div class="note"><strong>Nota:</strong> Login: <code>admin</code> · Palavra-passe: <code>admin</code><br>O administrador envia os emails de entrada aos clientes, não a si próprio. Por agora existe apenas um administrador.</div>'+
  '<form id="f"><label for="u">Utilizador ou email</label><input id="u" required autocomplete="username">'+
  '<label for="p">Palavra-passe</label><input id="p" type="password" required autocomplete="current-password">'+
  '<button class="full" type="submit">Entrar</button><div id="msg" class="msg" role="alert"></div></form>'+
  '<div class="switch"><a id="fg">Esqueci-me da palavra-passe</a><br>Ainda não tem conta? <a id="go">Criar conta</a></div></div>';
  if(msg)setMsg(msg,"ok");
  $("go").onclick=function(){render("registo")};
  $("fg").onclick=function(){render("recuperar")};
  $("f").onsubmit=async function(e){
    e.preventDefault();
    var u=$("u").value.trim().toLowerCase(),p=$("p").value,btn=e.target.querySelector("button");
    btn.disabled=true;
    try{
      if(u===CONFIG.ADMIN_USER&&p===CONFIG.ADMIN_PASS){
        if(!CONFIG.ADMIN_EMAIL){session={role:"admin",name:"Administrador"};save("sessao",session);return render()}
        await issueCode("login",CONFIG.ADMIN_EMAIL,"Administrador",{admin:true},true);
        return renderCode("Confirme a sua entrada","Enviámos um código para "+CONFIG.ADMIN_EMAIL+".");
      }
      var c=clients.find(function(x){return x.email===u});
      if(c&&await checkPass(c,p)){
        await issueCode("login",c.email,c.name,{},true);
        return renderCode("Confirme a sua entrada","Enviámos um código de 6 dígitos para "+c.email+".");
      }
      btn.disabled=false;
      setMsg("Utilizador ou palavra-passe incorretos. Verifique os dados e tente novamente.","err");
    }catch(err){btn.disabled=false;setMsg("Não foi possível enviar o código. Verifique a configuração do EmailJS.","err")}
  };
}

/* Ecrã genérico para introduzir o código recebido */
function renderCode(title,text,extra){
  $("app").innerHTML=
  '<h1>'+esc(title)+'</h1><p class="sub">'+esc(text)+' Válido durante 5 minutos.</p>'+
  '<div class="card"><form id="f"><label for="c">Código de 6 dígitos</label>'+
  '<input id="c" class="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required>'+
  (extra?extra:'')+
  '<button class="full" type="submit">Confirmar</button><div id="msg" class="msg" role="alert"></div></form>'+demoBox()+
  '<div class="switch"><button class="link" id="again" type="button">Enviar novo código</button> · <button class="link" id="back" type="button">Cancelar</button></div></div>';
  $("c").focus();
  $("back").onclick=function(){render()};
  $("again").onclick=async function(){
    if(!pending)return render();
    var p=pending;
    try{await issueCode(p.purpose,p.email,p.name,p.data,!p.fake);if(p.fake)pending.fake=true;renderCode(title,text,extra);setMsg("Enviámos um novo código.","ok")}
    catch(e){setMsg("Não foi possível enviar o código.","err")}
  };
  $("f").onsubmit=async function(e){
    e.preventDefault();
    var np;
    if(pending&&pending.purpose==="reset"){
      np=$("p").value;
      if(np.length<6)return setMsg("A palavra-passe precisa de pelo menos 6 caracteres.","err");
      if(np!==$("p2").value)return setMsg("As palavras-passe não coincidem.","err");
    }
    var r=checkCode($("c").value);
    if(r!=="ok")return setMsg(CODE_ERR[r],"err");
    var p=pending;pending=null;
    if(p.purpose==="login"){
      session=p.data.admin?{role:"admin",name:"Administrador"}:{role:"client",name:p.name,email:p.email};
      save("sessao",session);return render();
    }
    if(p.purpose==="register"){
      clients.push({name:p.name,email:p.email,hash:p.data.hash,date:new Date().toLocaleDateString("pt-PT"),sent:false,verified:true});
      save("clientes",clients);return renderLogin("Email confirmado e conta criada. Pode entrar agora.");
    }
    if(p.purpose==="reset"){
      var c=clients.find(function(x){return x.email===p.email});
      c.hash=await hashPass(np);delete c.pass;save("clientes",clients);
      return renderLogin("Palavra-passe alterada. Entre com a nova palavra-passe.");
    }
  };
}

function renderRegister(){
  $("app").innerHTML=
  '<h1>Criar conta</h1><p class="sub">Só são aceites emails '+esc(CONFIG.DOMINIO)+'. Vamos enviar um código para confirmar o email.</p>'+
  '<div class="card"><form id="f">'+
  '<label for="n">Nome</label><input id="n" required autocomplete="name">'+
  '<label for="e">Email</label><input id="e" type="email" required placeholder="nome'+esc(CONFIG.DOMINIO)+'" autocomplete="email">'+
  '<label for="p">Palavra-passe (mín. 6 caracteres)</label><input id="p" type="password" minlength="6" required autocomplete="new-password">'+
  '<label for="p2">Repetir palavra-passe</label><input id="p2" type="password" required autocomplete="new-password">'+
  '<button class="full" type="submit">Enviar código de confirmação</button><div id="msg" class="msg" role="alert"></div></form>'+
  '<div class="switch">Já tem conta? <a id="go">Entrar</a></div></div>';
  $("go").onclick=function(){render()};
  $("f").onsubmit=async function(e){
    e.preventDefault();
    var n=$("n").value.trim(),em=$("e").value.trim().toLowerCase(),p=$("p").value,btn=e.target.querySelector("button");
    var er=emailError(em);if(er)return setMsg(er,"err");
    if(p!==$("p2").value)return setMsg("As palavras-passe não coincidem.","err");
    if(clients.some(function(x){return x.email===em}))return setMsg("Este email já está registado. Use outro ou entre na conta.","err");
    btn.disabled=true;
    try{
      var hash=await hashPass(p);
      await issueCode("register",em,n,{hash:hash},true);
      renderCode("Confirme o seu email","Enviámos um código de 6 dígitos para "+em+".");
    }catch(err){btn.disabled=false;setMsg("Não foi possível enviar o código. Verifique a configuração do EmailJS.","err")}
  };
}

function renderForgot(){
  $("app").innerHTML=
  '<h1>Recuperar palavra-passe</h1><p class="sub">Indique o seu email. Enviamos um código para criar uma nova palavra-passe.</p>'+
  '<div class="card"><form id="f"><label for="e">Email</label><input id="e" type="email" required placeholder="nome'+esc(CONFIG.DOMINIO)+'" autocomplete="email">'+
  '<button class="full" type="submit">Enviar código</button><div id="msg" class="msg" role="alert"></div></form>'+
  '<div class="switch"><a id="go">Voltar ao login</a></div></div>';
  $("go").onclick=function(){render()};
  $("f").onsubmit=async function(e){
    e.preventDefault();
    var em=$("e").value.trim().toLowerCase(),btn=e.target.querySelector("button");
    var er=emailError(em);if(er)return setMsg(er,"err");
    btn.disabled=true;
    try{
      var c=clients.find(function(x){return x.email===em});
      await issueCode("reset",em,c?c.name:"",{},!!c);   // a resposta é igual exista a conta ou não
      renderCode("Nova palavra-passe","Se "+em+" tiver conta, enviámos um código de 6 dígitos para esse email.",
        '<label for="p">Nova palavra-passe (mín. 6 caracteres)</label><input id="p" type="password" minlength="6" required autocomplete="new-password">'+
        '<label for="p2">Repetir nova palavra-passe</label><input id="p2" type="password" required autocomplete="new-password">');
    }catch(err){btn.disabled=false;setMsg("Não foi possível enviar o código. Verifique a configuração do EmailJS.","err")}
  };
}

function renderClient(){
  $("app").innerHTML=
  '<div class="bar"><h1>Olá, '+esc(session.name)+'</h1><button class="ghost" id="out">Sair</button></div>'+
  '<div class="card"><h2>A sua conta está ativa</h2><p>Email: '+esc(session.email)+'</p><p class="sub">Receberá o email de entrada enviado pelo administrador.</p></div>';
  $("out").onclick=logout;
}

function renderAdmin(){
  var app=$("app");app.className="wide";
  var rows=clients.map(function(c,i){
    return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.date)+'</td>'+
    '<td><span class="tag'+(c.sent?' sent':'')+'">'+(c.sent?'Email enviado':'Por enviar')+'</span></td>'+
    '<td><button data-i="'+i+'">'+(c.sent?'Reenviar':'Enviar email de entrada')+'</button></td></tr>';
  }).join("");
  app.innerHTML=
  '<div class="bar"><div><h1>Painel do administrador</h1><p class="sub" style="margin:0">Os emails de entrada são enviados aos clientes, não ao administrador.</p></div><button class="ghost" id="out">Sair</button></div>'+
  '<div class="card"><h2>Clientes registados ('+clients.length+')</h2>'+
  '<div class="note">Remetente: <strong>'+esc(CONFIG.REMETENTE)+'</strong> · Envio: '+(autoMail?'automático (EmailJS)':'através do seu programa de email')+
  (CONFIG.ADMIN_EMAIL?'':'<br>2FA do admin desligado: defina <code>ADMIN_EMAIL</code> na configuração para o ativar.')+'</div>'+
  '<div id="msg" class="msg" role="status"></div>'+
  (clients.length?'<div class="table"><table><thead><tr><th>Nome</th><th>Email</th><th>Registo</th><th>Estado</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
  :'<p class="empty">Ainda não há clientes. Quando alguém criar conta, aparece aqui.</p>')+'</div>';
  $("out").onclick=logout;
  Array.prototype.forEach.call(app.querySelectorAll("button[data-i]"),function(b){
    b.onclick=function(){sendEntry(+b.dataset.i,b)};
  });
}

function sendEntry(i,btn){
  var c=clients[i];
  var texto="Olá "+c.name+",\n\nA sua conta está ativa. Entre em: "+siteUrl()+"\nUtilize o email "+c.email+" e a palavra-passe que escolheu no registo. Receberá um código por email em cada entrada.\n\nObrigado,\nAdministração";
  function done(){c.sent=true;save("clientes",clients);renderAdmin()}
  if(autoMail){
    btn.disabled=true;
    sendMail(c.email,c.name,"Acesso à Área de Clientes",texto).then(function(){done();setMsg("Email enviado para "+c.email+".","ok")},
      function(){btn.disabled=false;setMsg("Não foi possível enviar. Verifique as chaves do EmailJS na configuração.","err")});
  }else{
    location.href="mailto:"+encodeURIComponent(c.email)+"?subject="+encodeURIComponent("Acesso à Área de Clientes")+"&body="+encodeURIComponent(texto);
    setTimeout(done,400);
  }
}

function logout(){session=null;save("sessao",null);render()}
render();
</script>
</body>
</html>
